# logrotate.conf - place in /etc/logrotate.d/ci-build-feed
/opt/sales-analyzer/logs/*.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 0640 appuser appuser
    sharedscripts
    postrotate
        systemctl reload ci-build-watcher > /dev/null 2>&1 || true
    endscript
}

# Docker container logs (if using docker-compose)
/var/lib/docker/containers/*/*.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    create 0640 root root
}