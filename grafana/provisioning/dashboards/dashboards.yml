# grafana/provisioning/dashboards/dashboards.yml
apiVersion: 1

providers:
  - name: 'CI Build Dashboards'
    orgId: 1
    folder: 'CI Builds'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/definitions