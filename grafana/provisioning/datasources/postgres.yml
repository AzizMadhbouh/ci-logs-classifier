# grafana/provisioning/datasources/postgres.yml
apiVersion: 1

datasources:
  - name: Build History Postgres
    type: postgres
    access: proxy
    url: ${DB_HOST}:${DB_PORT}
    database: ${DB_NAME}
    user: ${DB_USER}
    secureJsonData:
      password: ${DB_PASSWORD}
    jsonData:
      sslmode: disable
      maxOpenConns: 100
      maxIdleConns: 10
      maxIdleConnsAuto: true
      connMaxLifetime: 14400
    isDefault: true
    editable: false