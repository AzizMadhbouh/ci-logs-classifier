name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install flake8 black mypy bandit pip-audit
          pip install -r requirements.txt

      - name: Check formatting with black
        run: python -m black --check src/ tests/

      - name: Lint with flake8
        run: python -m flake8 src/ tests/

      - name: Type check with mypy
        run: python -m mypy src/

      # Non-blocking: `safety check` was removed from safety v3 (deprecated
      # 2024-06); pip-audit reports known CVEs without failing the build.
      - name: Check dependencies for vulnerabilities
        run: python -m pip-audit --desc
        continue-on-error: true

      - name: Security scan with bandit
        run: python -m bandit -r src/

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest
