# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: python -m black --check src/ tests/

      - name: Type check (mypy)
        run: >
          python -m mypy
          --ignore-missing-imports --follow-imports=silent
          feed_jenkins_builds.py
          ml/severity_llm.py ml/category_model.py ml/rootcause_model.py
          logging_config.py watch_builds.py build_report.py

      - name: Test (pytest)
        run: python -m pytest -q --cov=feed_jenkins_builds --cov=ml --cov-report=term-missing

      # Non-blocking: reports known CVEs in the dependency tree without
      # turning every new advisory into a red build.
      - name: Dependency audit (informational)
        run: python -m pip-audit --desc
        continue-on-error: true

  docker:
    name: Docker Build
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ci-build-feed:test
          load: true

      # ENTRYPOINT is `python`, so only the python arguments are passed.
      - name: Smoke test
        run: >
          docker run --rm ci-build-feed:test
          -c "import feed_jenkins_builds, ml.severity_llm, ml.category_model;
          print('All modules import OK')"

  alembic:
    name: Alembic Migrations
    needs: lint-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: builduser
          POSTGRES_PASSWORD: buildpass
          POSTGRES_DB: buildhistory
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U builduser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        env:
          DB_USER: builduser
          DB_PASSWORD: buildpass
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: buildhistory
        run: alembic upgrade head

      - name: Test downgrade
        env:
          DB_USER: builduser
          DB_PASSWORD: buildpass
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: buildhistory
        run: alembic downgrade -1 && alembic upgrade head

  secrets:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          # The action already passes --fail; only credentials confirmed
          # live are reported here (no unknown/unverified noise).
          extra_args: --results=verified
