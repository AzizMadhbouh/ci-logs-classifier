# ---- docker-compose.yml ----
version: "3.9"

services:
  # One-shot ingestion (run manually or via cron)
  feed:
    build: .
    command: python feed_jenkins_builds.py --since 1
    env_file: .env
    depends_on:
      - postgres
    volumes:
      - ./logs:/app/logs
    profiles: ["ingest"]

  # Continuous watcher (runs forever)
  watcher:
    build: .
    command: python watch_builds.py --interval 30
    env_file: .env
    depends_on:
      - postgres
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    profiles: ["watch"]

  # Database (if not external)
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-builduser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buildpass}
      POSTGRES_DB: ${POSTGRES_DB:-buildhistory}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-builduser}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: