# ---- docker-compose.yml ----

services:
  # One-shot ingestion (run manually or via cron)
  # NOTE: image ENTRYPOINT is already ["python"], so command is args only.
  # NOTE 2: feed shells out to the host `wsl` binary to reach Jenkins, so in
  # this setup it must run on the Windows host (python feed_jenkins_builds.py),
  # not in a Linux container. This service is kept for hosts with Jenkins data
  # mounted at the same path inside the container.
  feed:
    build: .
    command: feed_jenkins_builds.py --since 1
    env_file: .env
    depends_on:
      - postgres
    volumes:
      - ./logs:/app/logs
      - ./category_model_finetuned:/app/category_model_finetuned:ro
    profiles: ["ingest"]

  # Continuous watcher (runs forever)
  watcher:
    build: .
    command: python watch_builds.py --interval 30
    env_file: .env
    depends_on:
      - postgres
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./category_model_finetuned:/app/category_model_finetuned:ro
    profiles: ["watch"]

  # Grafana (pre-provisioned dashboards + Postgres datasource)
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3001:3000"  # host 3000 is taken on this machine
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      # Inside the container, Postgres is reachable as `postgres`,
      # not localhost (which is what DB_HOST says for host-side scripts).
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - postgres

  # Database (if not external)
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-builduser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buildpass}
      POSTGRES_DB: ${POSTGRES_DB:-buildhistory}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-builduser}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: